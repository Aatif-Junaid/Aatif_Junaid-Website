<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Aatif Mulla AM monogram</title>
  <desc id="desc">A dimensional blue A and M monogram within a geometric frame.</desc>
  <defs>
    <linearGradient id="body" x1="23" y1="16" x2="105" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8eeaff"/>
      <stop offset=".16" stop-color="#47b5e6"/>
      <stop offset=".52" stop-color="#187bc0"/>
      <stop offset=".82" stop-color="#0d5b9c"/>
      <stop offset="1" stop-color="#093c6b"/>
    </linearGradient>
    <linearGradient id="facet" x1="34" y1="19" x2="89" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".88"/>
      <stop offset=".22" stop-color="#d7f8ff" stop-opacity=".38"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="depth" x="-22%" y="-22%" width="144%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.45" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offset"/>
      <feFlood flood-color="#063c70" flood-opacity=".36" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offset" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation=".34" result="edge"/>
      <feSpecularLighting in="edge" surfaceScale="2.1" specularConstant=".72" specularExponent="15" lighting-color="#effdff" result="specular">
        <feDistantLight azimuth="225" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specularMask"/>
      <feComposite in="specularMask" in2="SourceGraphic" operator="arithmetic" k2=".52" k3=".58" result="lit"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#body)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#depth)">
    <path d="M22 91V55L64 30l42 25v37l-42 24-42-24Z"/>
    <path d="M22 92 64 15l42 77"/>
    <path d="m33 92 16-25 15 22 15-22 17 25"/>
  </g>
  <g fill="none" stroke="url(#facet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".74">
    <path d="M25 55 64 32 101 55M25 91 64 113 101 92"/>
    <path d="M25 91 64 19 103 91M36 91 49 70"/>
  </g>
</svg>
