<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Aatif Mulla AM monogram</title>
  <desc id="desc">A blue nested A and M monogram with a glossy dimensional finish.</desc>
  <defs>
    <linearGradient id="blueDepth" x1="26" y1="18" x2="104" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48b8ed"/>
      <stop offset=".38" stop-color="#2186c4"/>
      <stop offset=".72" stop-color="#12639f"/>
      <stop offset="1" stop-color="#0a4679"/>
    </linearGradient>
    <linearGradient id="blueBevel" x1="34" y1="20" x2="84" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9f8ff" stop-opacity=".72"/>
      <stop offset=".14" stop-color="#84ddff" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#1f93cc" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="innerBevel" x1="45" y1="62" x2="83" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#54c4ef"/>
      <stop offset=".56" stop-color="#1777b8"/>
      <stop offset="1" stop-color="#0b5289"/>
    </linearGradient>
    <filter id="outerGlow" x="-24%" y="-20%" width="148%" height="148%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#2faddf" flood-opacity=".32" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offset"/>
      <feFlood flood-color="#07375f" flood-opacity=".32" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#outerGlow)">
    <path d="M20 100 64 18 108 100 64 122Z" stroke="#083e70" stroke-width="14" opacity=".34" transform="translate(0 2)"/>
    <path d="M20 100 64 18 108 100 64 122Z" stroke="url(#blueDepth)" stroke-width="13" filter="url(#softShadow)"/>
    <path d="M36 98 51 70Q54 64 59 70L64 78 69 70Q74 64 77 70L92 98" stroke="#0b4d83" stroke-width="13" transform="translate(0 2)" opacity=".36"/>
    <path d="M36 98 51 70Q54 64 59 70L64 78 69 70Q74 64 77 70L92 98" stroke="url(#innerBevel)" stroke-width="12" filter="url(#softShadow)"/>
    <path d="M23 98 64 22 105 98M24 100 64 120 104 100" stroke="url(#blueBevel)" stroke-width="2.1" opacity=".86"/>
    <path d="M39 98 53 73 59 81M70 81 76 73 89 98" stroke="#8ce1fa" stroke-width="1.45" opacity=".38"/>
  </g>
  <path d="M43 58 64 20 84 58" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity=".16"/>
</svg>
