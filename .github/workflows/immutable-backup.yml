name: Immutable backup

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: immutable-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ vars.AWS_BACKUP_BUCKET != '' && vars.AWS_BACKUP_ROLE_ARN != '' && vars.AWS_BACKUP_KMS_KEY_ARN != '' && vars.AWS_BACKUP_REGION != '' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_BACKUP_REGION }}
          role-session-name: github-immutable-backup

      - name: Export repository and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/export_repository_backup.ps1 -Repository $env:GITHUB_REPOSITORY -OutputDirectory backup

      - name: Create encrypted immutable archive
        env:
          AWS_BACKUP_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
          AWS_BACKUP_KMS_KEY_ARN: ${{ vars.AWS_BACKUP_KMS_KEY_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="${GITHUB_REPOSITORY#*/}-${stamp}.tar.gz"
          key="${GITHUB_REPOSITORY}/${archive}"
          retain_until="$(date -u -d '+10 years' +%Y-%m-%dT%H:%M:%SZ)"
          tar -czf "$archive" backup
          sha256sum "$archive" > "$archive.sha256"
          aws s3api put-object --bucket "$AWS_BACKUP_BUCKET" --key "$key" --body "$archive" --server-side-encryption aws:kms --ssekms-key-id "$AWS_BACKUP_KMS_KEY_ARN" --object-lock-mode COMPLIANCE --object-lock-retain-until-date "$retain_until" --checksum-algorithm SHA256
          aws s3api put-object --bucket "$AWS_BACKUP_BUCKET" --key "$key.sha256" --body "$archive.sha256" --server-side-encryption aws:kms --ssekms-key-id "$AWS_BACKUP_KMS_KEY_ARN" --object-lock-mode COMPLIANCE --object-lock-retain-until-date "$retain_until" --checksum-algorithm SHA256
