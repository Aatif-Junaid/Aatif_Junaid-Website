<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Aatif Mulla AM monogram, glossy blue</title>
  <desc id="desc">A glossy blue A frame with a distinct M nested inside it.</desc>
  <defs>
    <linearGradient id="blueDepth" x1="21" y1="16" x2="108" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79d6f5"/>
      <stop offset=".18" stop-color="#3da7dc"/>
      <stop offset=".54" stop-color="#1978b5"/>
      <stop offset=".82" stop-color="#105b94"/>
      <stop offset="1" stop-color="#083d6c"/>
    </linearGradient>
    <linearGradient id="mDepth" x1="39" y1="67" x2="91" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fc2eb"/>
      <stop offset=".45" stop-color="#1b82bd"/>
      <stop offset="1" stop-color="#0a4d81"/>
    </linearGradient>
    <linearGradient id="bevel" x1="28" y1="17" x2="82" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3fdff" stop-opacity=".88"/>
      <stop offset=".19" stop-color="#c9f5ff" stop-opacity=".46"/>
      <stop offset=".58" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="148%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.25" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.65" result="offset"/>
      <feFlood flood-color="#06365f" flood-opacity=".31" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-22%" y="-22%" width="144%" height="144%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.15" result="blur"/>
      <feFlood flood-color="#43bde9" flood-opacity=".26" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge><feMergeNode in="softGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <g filter="url(#lift)">
      <path d="M20 104 64 17 108 104" stroke="url(#blueDepth)" stroke-width="8.4"/>
      <path d="M20 104 64 126 108 104" stroke="url(#blueDepth)" stroke-width="8.4"/>
      <path d="M39 98 51 73Q53.5 68.5 56.5 73L64 85 71.5 73Q74.5 68.5 77 73L89 98" stroke="url(#mDepth)" stroke-width="7.6"/>
    </g>
    <path d="M22.8 102.5 64 21.3 105.2 102.5M23.4 105.2 64 124 104.6 105.2" stroke="url(#bevel)" stroke-width="1.35" opacity=".88"/>
    <path d="M41.2 96.5 52.2 74.3M76.2 74.3 87.1 96.5" stroke="#d6f8ff" stroke-width="1.05" opacity=".54"/>
  </g>
</svg>
